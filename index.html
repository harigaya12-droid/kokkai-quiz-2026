rder-radius:18px;border-width:3px}.cover .notice{font-size:11px;padding:4px 7px}.startbtn{font-size:clamp(9px,2.3vw,17px);border-width:2px}}
</style></head><body><section id="start" class="screen cover"><img src="表紙.png" alt="松原仁の国会クイズ オリジナル表紙"><div class="notice">✨ 全10問・5つのエリア ✨</div><button class="startbtn" onclick="startGame()">国会探検スタート！ ▶</button></section><section id="game" class="screen game hide"><header class="top"><div><div class="brand">🏛 松原仁の 国会クイズ</div><div class="subtitle">国会議事堂を探検しながら、遊んで学ぼう！</div></div><div class="total">全10問</div></header><nav class="route" id="route" aria-label="探検の進行状況"></nav><div class="progress"><div id="bar"></div></div><div class="stage"><aside class="character"><div class="speech" id="speech"></div><img id="guide" src="ヒーロー.webp" alt="松原仁キャラクター"></aside><article class="panel"><div class="room" id="room"></div><div class="stat" id="counter"></div><div class="question" id="question"></div><div class="choices" id="choices"></div><div class="result hide" id="result"><img id="reaction" alt="正誤のリアクション"><h2 id="message"></h2><div class="explain" id="explain"></div><button class="next" onclick="nextQuestion()" id="next">次の部屋へ進む ▶</button></div></article></div></section><section class="screen finish hide" id="finish"><h1 id="finishTitle"></h1><img id="finishImage" alt="ゴール"><p id="finishText"></p><button class="next" onclick="startGame()">もう一度挑戦する ▶</button></section><div class="foot">国会について学ぶ非公式の教育用ゲームです。特定の政治家・団体の公式制作物ではありません。</div><script>const questions=[
{p:'国会議事堂・正門',q:'日本の国会は、何を担う機関と定められている？',o:['国の唯一の立法機関','裁判を行う最高機関','地方自治体の代表機関','行政を執行する機関'],a:0,e:'日本国憲法第41条では、国会は国権の最高機関であり、国の唯一の立法機関と定められています。'},
{p:'中央広間',q:'日本の国会を構成する二つの議院は？',o:['衆議院と参議院','衆議院と最高裁判所','参議院と内閣','内閣と地方議会'],a:0,e:'日本の国会は、衆議院と参議院からなる二院制です。'},
{p:'衆議院・議場',q:'衆議院議員の任期は原則何年？',o:['2年','3年','4年','6年'],a:2,e:'衆議院議員の任期は4年です。ただし衆議院が解散された場合は任期途中でも終了します。'},
{p:'参議院・議場',q:'参議院議員の任期は何年？',o:['3年','4年','5年','6年'],a:3,e:'参議院議員の任期は6年で、3年ごとに議員の半数が改選されます。'},
{p:'委員会室',q:'法案を詳しく審査する場として適切なのは？',o:['委員会','裁判所','大使館','都道府県警察'],a:0,e:'国会では本会議だけでなく、各委員会でも法案などを詳しく審査します。'},
{p:'予算委員会室',q:'国の予算を先に審議するのはどちらの議院？',o:['参議院','衆議院','同時に始める決まり','最高裁判所'],a:1,e:'日本国憲法第60条により、予算は先に衆議院に提出しなければなりません。'},
{p:'国会図書館・資料室',q:'国会議員の調査や立法活動を支える国立の図書館は？',o:['国立国会図書館','国立科学博物館','国立公文書館だけ','東京都立中央図書館'],a:0,e:'国立国会図書館は、国会議員の調査研究を支援する役割を担っています。'},
{p:'本会議場',q:'内閣総理大臣を指名するのはどこ？',o:['国会','最高裁判所','各都道府県知事','日本銀行'],a:0,e:'内閣総理大臣は、国会議員の中から国会の議決で指名されます。'},
{p:'議員会館・会議室',q:'国会議員が政府に質問するために提出できるものは？',o:['質問主意書','住民票','運転免許証','戸籍謄本'],a:0,e:'議員は議院の規則に従い、質問主意書を提出して政府に質問することができます。'},
{p:'国会議事堂・ゴール',q:'憲法改正の発議には、各議院の総議員の何分の何以上の賛成が必要？',o:['過半数','3分の2','4分の1','全員一致'],a:1,e:'憲法第96条により、各議院の総議員の3分の2以上の賛成で国会が発議し、国民の承認を経ます。'}
];
let index=0,correct=0,answered=false;const $=id=>document.getElementById(id);const names=['正門','議場','委員会','資料室','ゴール'];function show(id){['start','game','finish'].forEach(s=>$(s).classList.toggle('hide',s!==id))}function startGame(){index=0;correct=0;show('game');render();window.scrollTo(0,0)}function render(){answered=false;const q=questions[index];$('result').classList.add('hide');$('choices').innerHTML='';$('room').textContent='📍 '+q.p;$('counter').textContent=`第 ${index+1} 問 ／ 全10問　｜　正解 ${correct} 問`;$('question').textContent=q.q;$('speech').textContent=['正門からスタート！国会の仕組みを学ぼう！','議場を探検！議員の仕事を知ろう！','委員会で法案の審査を学ぼう！','資料室で知識を深めよう！','ゴールはもうすぐ！最後まで頑張ろう！'][Math.floor(index/2)];$('guide').src='ヒーロー.webp';$('bar').style.width=(index/10*100)+'%';$('route').innerHTML=names.map((s,i)=>`<span class="stop ${Math.floor(index/2)===i?'active':''}">${i+1} ${s}</span>`).join('');q.o.forEach((option,i)=>{let b=document.createElement('button');b.className='choice';b.textContent='①②③④'[i]+'　'+option;b.onclick=()=>answer(i,b);$('choices').appendChild(b)})}function answer(i,button){if(answered)return;answered=true;const q=questions[index],ok=i===q.a;if(ok)correct++;document.querySelectorAll('.choice').forEach(b=>b.disabled=true);button.classList.add('selected');$('reaction').src=ok?'正しい.webp':'間違った.webp';$('guide').src=ok?'正しい.webp':'間違った.webp';$('message').textContent=ok?'🎉 正解！ おめでとう！':'💡 惜しい！ 解説を確認しよう！';$('explain').textContent='正解：'+q.o[q.a]+'。 '+q.e;$('next').textContent=index===9?'🏆 結果を見る ▶':'🚪 次の部屋へ進む ▶';$('counter').textContent=`第 ${index+1} 問 ／ 全10問　｜　正解 ${correct} 問`;$('result').classList.remove('hide');$('speech').textContent=ok?'大正解！次の部屋へ進もう！':'次の問題で挽回しよう！';$('result').scrollIntoView({behavior:'smooth',block:'nearest'})}function nextQuestion(){index++;if(index<questions.length){render();$('game').scrollIntoView({behavior:'smooth',block:'start'})}else{show('finish');$('finishTitle').textContent=correct===10?'🏆 全問正解！ おめでとう！':'🎊 国会探検ゴール！';$('finishImage').src=correct===10?'win.webp':'反応.webp';$('finishText').textContent=`全10問中 ${correct} 問正解！` ;window.scrollTo(0,0)}}
