<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142b56"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png"><title>松原仁の国会クイズ</title><style>
:root{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;color:#fff;background:#101b36}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 5%,#3065b4 0%,#15294f 46%,#0c1429 100%)}main{max-width:760px;margin:auto;padding:22px 15px 55px;text-align:center}.pill{display:inline-block;background:#ffe4a1;color:#623c00;padding:7px 17px;border-radius:50px;font-size:12px;font-weight:800;letter-spacing:.08em}h1{font-size:clamp(27px,6vw,44px);margin:15px 0 6px;text-shadow:0 4px 8px #071329}p{line-height:1.7}.sub{color:#dce8ff;font-size:14px}.hero{width:min(100%,440px);display:block;margin:17px auto;border-radius:25px;box-shadow:0 14px 35px #050d23a8}.panel{background:#fff;color:#1b2d51;border:3px solid #eac46d;border-radius:22px;padding:22px 18px;box-shadow:0 10px 0 #06142b,0 22px 45px #040b20a8;margin:22px 0}.btn{display:block;width:100%;padding:17px 14px;margin:12px 0;border-radius:15px;border:0;background:linear-gradient(#ffe5a4,#e7ad39);box-shadow:0 5px 0 #9c6720;color:#182443;font-size:17px;font-weight:900;cursor:pointer;touch-action:manipulation}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #9c6720}.option{background:#eef4ff;box-shadow:0 4px 0 #b6c9e9;border:2px solid #bdd3fa;text-align:left;padding:15px 18px}.option:disabled{opacity:.7;cursor:default}.option.selected{border-color:#e9ad2e;background:#fff0bd}.hide{display:none!important}.progress{height:11px;background:#29436f;border-radius:20px;overflow:hidden;margin:20px 0}.progress>div{height:100%;background:linear-gradient(90deg,#e6aa37,#fff0aa);transition:width .3s}.question{font-size:clamp(19px,4.7vw,25px);font-weight:900;line-height:1.55;margin:12px 0 20px}.feedback{width:min(100%,370px);border-radius:15px;margin:8px auto}.explain{font-size:14px;line-height:1.8;text-align:left;background:#f0f5ff;padding:13px;border-radius:12px}.stat{font-weight:900;color:#a36a06}.foot{font-size:11px;color:#c2d1ee;margin-top:25px} .mapline{display:flex;justify-content:space-between;gap:5px;font-size:11px;color:#ffdc88;margin:12px 0;flex-wrap:wrap}.step{background:#253f70;border:1px solid #5c85c2;border-radius:30px;padding:7px 9px}.step.active{background:#f1c96e;color:#162343;font-weight:900}.spark{font-size:22px;letter-spacing:9px;color:#ffdf72}@media(max-width:480px){main{padding:15px 12px 42px}.panel{padding:16px 13px}.btn{font-size:16px}}
#start.classic-start{max-width:790px;margin:0 auto}#start .classic-diet{display:block;width:min(100%,620px);height:230px;object-fit:cover;object-position:center 38%;border-radius:18px;margin:34px auto 20px;box-shadow:0 16px 35px #06152d88}#start .classic-panel{background:#f8faff;color:#3b5180;border-radius:20px;padding:24px 30px 28px;margin:0 auto;max-width:790px}#start .classic-panel p{font-size:15px;letter-spacing:.05em;line-height:2;margin:0 0 15px}#start .classic-panel .btn{border-radius:12px;margin:0;font-size:17px}body:has(#start:not(.hide)) main{max-width:820px}body:has(#start:not(.hide)) .pill{background:transparent;color:#f2ca72;letter-spacing:.14em}body:has(#start:not(.hide)) h1{font-size:clamp(37px,6vw,55px);line-height:1.22;margin:12px 0 15px}body:has(#start:not(.hide)) .sub{font-size:15px}@media(max-width:480px){#start .classic-diet{height:180px;margin:23px auto 16px}#start .classic-panel{padding:18px 14px 21px}#start .classic-panel p{font-size:13px}}
</style></head><body><main><div class="pill">🏛 遊びながら政治を知ろう！</div><h1>松原仁の<br>国会クイズ</h1><p class="sub">国会議事堂を探検しながら、全10問に挑戦！</p>
<section id="start" class="classic-start"><img class="classic-diet" src="hero.webp" alt="国会議事堂と松原仁キャラクター"><div class="classic-panel"><p>問題はすべて四択です。<br>回答すると、正解と解説が表示されます。</p><button class="btn" onclick="startGame()">クイズをスタート！</button></div></section>
<section id="game" class="hide"><div class="mapline" id="route"></div><div class="progress"><div id="bar" style="width:0%"></div></div><div class="pill" id="place"></div><div class="panel"><div class="stat" id="counter"></div><div class="question" id="question"></div><div id="options"></div><div id="result" class="hide"><img class="feedback" id="reaction" alt="回答結果"><div id="answerMessage" class="question"></div><div class="explain" id="explain"></div><button class="btn" id="next" onclick="nextQuestion()">次の部屋へ進む ➜</button></div></div></section>
<section id="finish" class="hide"><img class="hero" id="finishImage" src="win.webp" alt="全問正解 おめでとうございます"><div class="panel"><h2 id="finishTitle"></h2><p id="finishText"></p><button class="btn" onclick="startGame()">🔁 もう一度挑戦する</button></div></section>
<p class="foot">国会について学ぶ非公式の教育用ゲームです。特定の政治家・団体の公式制作物ではありません。</p></main><script>
const questions=[
{p:'国会議事堂・正門',q:'日本の国会は、何を担う機関と定められている？',o:['国の唯一の立法機関','裁判を行う最高機関','地方自治体の代表機関','行政を執行する機関'],a:0,e:'日本国憲法第41条では、国会は国権の最高機関であり、国の唯一の立法機関と定められています。'},
{p:'中央広間',q:'日本の国会を構成する二つの議院は？',o:['衆議院と参議院','衆議院と最高裁判所','参議院と内閣','内閣と地方議会'],a:0,e:'日本の国会は、衆議院と参議院からなる二院制です。'},
{p:'衆議院・議場',q:'衆議院議員の任期は原則何年？',o:['2年','3年','4年','6年'],a:2,e:'衆議院議員の任期は4年です。ただし衆議院が解散された場合は任期途中でも終了します。'},
{p:'参議院・議場',q:'参議院議員の任期は何年？',o:['3年','4年','5年','6年'],a:3,e:'参議院議員の任期は6年で、3年ごとに議員の半数が改選されます。'},
{p:'委員会室',q:'法案を詳しく審査する場として適切なのは？',o:['委員会','裁判所','大使館','都道府県警察'],a:0,e:'国会では本会議だけでなく、各委員会でも法案などを詳しく審査します。'},
{p:'予算委員会室',q:'国の予算を先に審議するのはどちらの議院？',o:['参議院','衆議院','同時に始める決まり','最高裁判所'],a:1,e:'日本国憲法第60条により、予算は先に衆議院に提出しなければなりません。'},
{p:'国会図書館・資料室',q:'国会議員の調査や立法活動を支える国立の図書館は？',o:['国立国会図書館','国立科学博物館','国立公文書館だけ','東京都立中央図書館'],a:0,e:'国立国会図書館は、国会議員の調査研究を支援する役割を担っています。'},
{p:'本会議場',q:'内閣総理大臣を指名するのはどこ？',o:['国会','最高裁判所','各都道府県知事','日本銀行'],a:0,e:'内閣総理大臣は、国会議員の中から国会の議決で指名されます。'},
{p:'議員会館・会議室',q:'国会議員が政府に質問するために提出できるものは？',o:['質問主意書','住民票','運転免許証','戸籍謄本'],a:0,e:'議員は議院の規則に従い、質問主意書を提出して政府に質問することができます。'},
{p:'国会議事堂・ゴール',q:'憲法改正の発議には、各議院の総議員の何分の何以上の賛成が必要？',o:['過半数','3分の2','4分の1','全員一致'],a:1,e:'憲法第96条により、各議院の総議員の3分の2以上の賛成で国会が発議し、国民の承認を経ます。'}
];
let index=0,correct=0,answered=false;
function show(id){for(const el of ['start','game','finish'])document.getElementById(el).classList.toggle('hide',el!==id)}
function startGame(){index=0;correct=0;show('game');render();scrollTo({top:0,behavior:'smooth'})}
function render(){answered=false;const q=questions[index];document.getElementById('result').classList.add('hide');document.getElementById('counter').textContent=`第 ${index+1} 問 / 全10問　｜　正解 ${correct} 問`;document.getElementById('place').textContent='📍 '+q.p;document.getElementById('question').textContent=q.q;document.getElementById('bar').style.width=(index/10*100)+'%';document.getElementById('route').innerHTML=['正門','議場','委員会','資料室','ゴール'].map((s,i)=>`<span class="step ${Math.floor(index/2)===i?'active':''}">${s}</span>`).join('');const box=document.getElementById('options');box.innerHTML='';q.o.forEach((option,i)=>{const b=document.createElement('button');b.className='btn option';b.textContent='①②③④'[i]+'　'+option;b.onclick=()=>answer(i,b);box.appendChild(b)})}
function answer(i,button){if(answered)return;answered=true;const q=questions[index],ok=i===q.a;if(ok)correct++;document.querySelectorAll('.option').forEach(b=>b.disabled=true);button.classList.add('selected');document.getElementById('reaction').src=ok?'correct.webp':'wrong.webp';document.getElementById('answerMessage').textContent=ok?'🎉 正解！ 次の部屋へ進もう！':'💡 残念！ 解説を読んで次へ進もう！';document.getElementById('explain').textContent='正解：'+q.o[q.a]+'。 '+q.e;document.getElementById('next').textContent=index===9?'🏆 結果を見る':'🚪 次の部屋へ進む';document.getElementById('result').classList.remove('hide');document.getElementById('counter').textContent=`第 ${index+1} 問 / 全10問　｜　正解 ${correct} 問`;document.getElementById('result').scrollIntoView({behavior:'smooth',block:'nearest'})}
function nextQuestion(){index++;if(index<10){render();document.getElementById('game').scrollIntoView({behavior:'smooth',block:'start'})}else{show('finish');document.getElementById('finishImage').src=correct===10?'win.webp':'hero.webp';document.getElementById('finishTitle').textContent=correct===10?'🏆 全問正解！おめでとうございます！':'🎊 国会探検ゴール！';document.getElementById('finishText').textContent=`10問中 ${correct} 問正解！ ${correct===10?'素晴らしい！ 国会クイズを完全制覇しました！':'もう一度挑戦して全問正解を目指そう！'}`;scrollTo({top:0,behavior:'smooth'})}}
</script></body></html>
