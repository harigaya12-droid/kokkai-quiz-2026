<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101e39"><title>松原仁の国会クイズ</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><style>
:root{font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;color:#f8fbff;background:#0c1830}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0%,#345b8b 0%,#142748 43%,#081427 100%)}.wrap{max-width:820px;margin:auto;padding:22px 16px 42px}.brand{display:flex;align-items:center;gap:10px;justify-content:center;font-size:12px;letter-spacing:.18em;color:#d7c394}.seal{width:30px;height:30px;border:2px solid #e3c57c;border-radius:50%;display:grid;place-items:center;color:#f5d891;font-weight:900}.hero{text-align:center;padding:18px 0 8px}.eyebrow{font-size:12px;color:#f3d795;letter-spacing:.2em;font-weight:bold}h1{font-size:clamp(30px,7vw,52px);line-height:1.22;margin:12px 0;text-shadow:0 3px 18px #071124}.lead{font-size:14px;line-height:1.8;color:#d7e4f5}.scene{position:relative;height:210px;max-width:620px;margin:16px auto 22px;overflow:hidden;border-radius:18px;background:linear-gradient(#5d91c6,#bed8ec 58%,#e7e1c8 58%,#d7d2bc 100%);box-shadow:0 16px 45px #02091780}.sun{position:absolute;right:65px;top:20px;width:60px;height:60px;border-radius:50%;background:#fff7cb88}.diet{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);width:76%;height:120px;filter:drop-shadow(0 5px 4px #45536366)}.wing{position:absolute;bottom:0;width:43%;height:68px;background:repeating-linear-gradient(90deg,#d5d0bd 0 14px,#b9b29d 15px 17px);border-top:12px solid #a69f8d}.wing.l{left:0}.wing.r{right:0}.mid{position:absolute;bottom:0;left:34%;width:32%;height:94px;background:#d7d1bd;border:5px solid #b7af98}.tower{position:absolute;left:39%;bottom:75px;width:22%;height:46px;background:#c6c0ab;clip-path:polygon(10% 100%,10% 35%,25% 35%,25% 0,75% 0,75% 35%,90% 35%,90% 100%)}.roof{position:absolute;left:34%;bottom:112px;width:32%;height:32px;background:#b7b09a;clip-path:polygon(50% 0,100% 100%,0 100%)}.stairs{position:absolute;bottom:-3px;left:25%;width:50%;height:22px;background:repeating-linear-gradient(0deg,#a5a08e 0 4px,#dad5c2 5px 7px)}.panel{background:#f9fbff;color:#172844;border:1px solid #ffffff99;border-radius:20px;padding:clamp(18px,5vw,30px);box-shadow:0 15px 50px #0005}.hidden{display:none!important}.btn{border:0;cursor:pointer;font:inherit;font-weight:800;border-radius:13px;padding:15px 20px;transition:transform .1s,background .1s}.btn:active{transform:scale(.98)}.primary{background:linear-gradient(120deg,#f2d58d,#e6ac52);color:#202a39;width:100%;box-shadow:0 5px 0 #ae7939}.secondary{background:#e8edf5;color:#1e3553}.topline{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#56708f;font-size:13px;font-weight:800}.progress{height:9px;border-radius:20px;background:#e5eaf2;margin:14px 0 22px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#b78a42,#efcf81);transition:width .3s}.question{font-size:clamp(20px,4vw,27px);font-weight:900;line-height:1.6;margin:0 0 20px}.choices{display:grid;gap:11px}.choice{text-align:left;width:100%;padding:16px;border:2px solid #e1e8f1;background:white;color:#1c304b;border-radius:13px;font-weight:700;font-size:16px;cursor:pointer}.choice:hover:not(:disabled){border-color:#c09b59;background:#fffbf0}.choice:disabled{cursor:default}.choice.correct{border-color:#1c9b70;background:#e1f8ed}.choice.wrong{border-color:#db5a5a;background:#fff0ef}.feedback{margin:18px 0 0;padding:14px 16px;border-radius:12px;background:#eef3f9;line-height:1.7}.feedback strong{display:block;font-size:18px;margin-bottom:4px}.foot{font-size:12px;text-align:center;color:#a9bdd5;margin-top:18px}.resulticon{font-size:58px;text-align:center}.resulttitle{text-align:center;font-size:30px;color:#1e3656;margin:10px 0}.score{text-align:center;font-size:46px;font-weight:900;color:#ad7d2f}.resultcopy{text-align:center;line-height:1.8;color:#48617f;margin-bottom:25px}@media(min-width:650px){.choices{grid-template-columns:1fr 1fr}}@media(max-width:420px){.scene{height:170px}.diet{height:100px}.wing{height:55px}.mid{height:76px}.tower{bottom:60px}.roof{bottom:94px}}
</style></head><body><main class="wrap"><div class="brand"><span class="seal">国</span>LEARN ABOUT THE NATIONAL DIET</div><section id="intro"><div class="hero"><div class="eyebrow">遊びながら政治を知ろう！</div><h1>松原仁の<br>国会クイズ</h1><p class="lead">国会の仕組みや政治の基本を学ぶ、全10問のチャレンジ。<br>全問正解を目指して、国会のゴールへ進もう！</p></div><div class="scene" role="img" aria-label="国会議事堂をイメージしたイラスト"><div class="sun"></div><div class="diet"><div class="wing l"></div><div class="wing r"></div><div class="mid"></div><div class="tower"></div><div class="roof"></div><div class="stairs"></div></div></div><div class="panel"><p style="text-align:center;color:#4c6482;line-height:1.8;margin-top:0">問題はすべて四択です。<br>回答すると、正解と解説が表示されます。</p><button class="btn primary" id="start">クイズをスタート！</button></div></section><section id="game" class="panel hidden" aria-live="polite"><div class="topline"><span id="stage">第1問 / 全10問</span><span id="points">正解 0問</span></div><div class="progress"><div id="fill" class="fill"></div></div><p id="question" class="question"></p><div id="choices" class="choices"></div><div id="feedback" class="feedback hidden"></div><button id="next" class="btn primary hidden" style="margin-top:20px">次の問題へ進む →</button></section><section id="result" class="panel hidden" aria-live="polite"><div id="resulticon" class="resulticon">🎉</div><h2 id="resulttitle" class="resulttitle">チャレンジ完了！</h2><div id="score" class="score">0 / 10</div><p id="resultcopy" class="resultcopy"></p><button id="retry" class="btn primary">もう一度チャレンジする</button></section><p class="foot">国会について学ぶ非公式の教育用クイズです。特定の政治家・団体の公式制作物ではありません。</p></main><script>
'use strict';const data=[
{q:'日本の国会は、どの2つの議院で構成されている？',a:['衆議院と参議院','衆議院と内閣','参議院と最高裁判所','内閣と地方議会'],c:0,e:'日本の国会は衆議院と参議院からなる二院制です。'},
{q:'日本の国会は、憲法で何と位置付けられている？',a:['行政の最高機関','国権の最高機関','司法の最高機関','地方自治の最高機関'],c:1,e:'日本国憲法第41条は、国会を「国権の最高機関」であり「国の唯一の立法機関」と定めています。'},
{q:'衆議院議員の任期は原則何年？',a:['2年','3年','4年','6年'],c:2,e:'衆議院議員の任期は4年ですが、衆議院が解散されると任期満了前に終了します。'},
{q:'参議院議員の任期は何年？',a:['3年','4年','5年','6年'],c:3,e:'参議院議員の任期は6年で、3年ごとに議員の半数が改選されます。'},
{q:'法律案を審議し、法律を成立させる中心的な機関は？',a:['国会','日本銀行','都道府県警察','裁判所'],c:0,e:'法律を制定する権限を担うのは国会です。'},
{q:'内閣総理大臣を指名するのはどこ？',a:['最高裁判所','国会','都道府県知事','日本銀行'],c:1,e:'内閣総理大臣は国会の議決で指名され、天皇が任命します。'},
{q:'国会議事堂がある東京都の地域は？',a:['新宿区西新宿','港区六本木','千代田区永田町','台東区上野'],c:2,e:'国会議事堂は東京都千代田区永田町にあります。'},
{q:'国会で毎年1回召集される会期は？',a:['特別会','臨時会','地方会','常会（通常国会）'],c:3,e:'常会（通常国会）は毎年1回召集され、会期は原則150日です。'},
{q:'予算について、先に審議する権限があるのは？',a:['衆議院','参議院','最高裁判所','都道府県議会'],c:0,e:'憲法第60条により、予算は先に衆議院に提出しなければなりません。'},
{q:'衆議院が解散されたとき、参議院は原則どうなる？',a:['同時に解散する','同時に閉会する','議員全員が改選される','議員の任期が2年延びる'],c:1,e:'衆議院が解散されると参議院も同時に閉会します。ただし緊急の必要があるときは参議院の緊急集会を求めることができます。'}
];let i=0,correct=0,answered=false;const $=id=>document.getElementById(id);function show(id){for(const x of ['intro','game','result'])$(x).classList.toggle('hidden',x!==id)}function render(){answered=false;const d=data[i];$('stage').textContent=`第${i+1}問 / 全${data.length}問`;$('points').textContent=`正解 ${correct}問`;$('fill').style.width=`${i/data.length*100}%`;$('question').textContent=d.q;$('feedback').classList.add('hidden');$('next').classList.add('hidden');$('choices').replaceChildren();d.a.forEach((s,n)=>{const b=document.createElement('button');b.className='choice';b.textContent=`${'ABCD'[n]}. ${s}`;b.onclick=()=>answer(n);$('choices').appendChild(b)})}function answer(n){if(answered)return;answered=true;const d=data[i];if(n===d.c)correct++;[...$('choices').children].forEach((b,j)=>{b.disabled=true;if(j===d.c)b.classList.add('correct');else if(j===n)b.classList.add('wrong')});$('points').textContent=`正解 ${correct}問`;$('feedback').classList.remove('hidden');$('feedback').replaceChildren();const strong=document.createElement('strong');strong.textContent=n===d.c?'🎉 正解！':'💡 惜しい！';const desc=document.createElement('span');desc.textContent=d.e;$('feedback').append(strong,desc);$('next').textContent=i===data.length-1?'結果を見る →':'次の問題へ進む →';$('next').classList.remove('hidden')}function finish(){$('resulticon').textContent=correct===data.length?'🏆':'🎓';$('resulttitle').textContent=correct===data.length?'全問正解！おめでとう！':'チャレンジ完了！';$('score').textContent=`${correct} / ${data.length}`;$('resultcopy').textContent=correct===data.length?'国会クイズを全問クリア！素晴らしい知識です。':'お疲れさまでした！もう一度挑戦して、全問正解を目指しましょう。';show('result')}$('start').onclick=()=>{i=0;correct=0;show('game');render()};$('next').onclick=()=>{i++;if(i===data.length)finish();else render()};$('retry').onclick=()=>{i=0;correct=0;show('game');render()};
</script></body></html>
